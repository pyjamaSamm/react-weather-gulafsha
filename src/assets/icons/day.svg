<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clear day">
  <defs>
    <!-- userSpaceOnUse: an objectBoundingBox gradient degenerates on the rays,
         whose bounding boxes are zero-width lines. -->
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="32" y1="19.5" x2="32" y2="44.5">
      <stop offset="0" stop-color="#FFDE72"/>
      <stop offset="1" stop-color="#FF9A16"/>
    </linearGradient>
    <style>
      .rays { animation: spin 24s linear infinite; transform-origin: 32px 32px; }
      .halo { animation: breathe 3.2s ease-in-out infinite; transform-origin: 32px 32px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: .32; }
        50%      { transform: scale(1.14); opacity: .1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .rays, .halo { animation: none; }
      }
    </style>
  </defs>

  <circle class="halo" cx="32" cy="32" r="15" fill="#FFC93C"/>

  <g class="rays" stroke="#FFB524" stroke-width="3.6" stroke-linecap="round">
    <line x1="32" y1="5"  x2="32" y2="12"/>
    <line x1="32" y1="52" x2="32" y2="59"/>
    <line x1="5"  y1="32" x2="12" y2="32"/>
    <line x1="52" y1="32" x2="59" y2="32"/>
    <line x1="13" y1="13" x2="18" y2="18"/>
    <line x1="46" y1="46" x2="51" y2="51"/>
    <line x1="13" y1="51" x2="18" y2="46"/>
    <line x1="46" y1="18" x2="51" y2="13"/>
  </g>

  <circle cx="32" cy="32" r="12.5" fill="url(#sun)"/>
  <circle cx="27.5" cy="27.5" r="4" fill="#FFF1C1" opacity=".5"/>
</svg>
