<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clear night">
  <defs>
    <linearGradient id="moon" gradientUnits="userSpaceOnUse" x1="14" y1="14" x2="46" y2="50">
      <stop offset="0" stop-color="#FFF7DC"/>
      <stop offset="1" stop-color="#F0C24B"/>
    </linearGradient>
    <!-- Crescent = disc minus an equal disc offset 14px, so the horns curl
         past the centre line instead of meeting in a lens. -->
    <mask id="bite">
      <circle cx="32" cy="32" r="20" fill="#fff"/>
      <circle cx="46" cy="32" r="20" fill="#000"/>
    </mask>
    <style>
      .moon  { animation: sway 6s ease-in-out infinite; transform-origin: 32px 32px; }
      .star  { animation: twinkle 2.6s ease-in-out infinite; transform-origin: center; }
      .star2 { animation-delay: .9s; }
      .star3 { animation-delay: 1.7s; }
      @keyframes sway {
        0%, 100% { transform: rotate(-5deg); }
        50%      { transform: rotate(4deg); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: .25; transform: scale(.7); }
        50%      { opacity: 1;   transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .moon, .star { animation: none; }
      }
    </style>
  </defs>

  <g transform="rotate(-20 32 32)">
    <g class="moon">
      <g mask="url(#bite)">
        <circle cx="32" cy="32" r="20" fill="url(#moon)"/>
        <circle cx="20"   cy="26" r="2.8" fill="#DFAF41" opacity=".3"/>
        <circle cx="21.5" cy="40" r="2"   fill="#DFAF41" opacity=".26"/>
        <circle cx="16"   cy="33" r="1.4" fill="#DFAF41" opacity=".24"/>
      </g>
    </g>
  </g>

  <g fill="#FFE9A8">
    <circle class="star"       cx="51" cy="15" r="2.2"/>
    <circle class="star star2" cx="57" cy="31" r="1.5"/>
    <circle class="star star3" cx="18" cy="15" r="1.6"/>
  </g>
</svg>
