<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cloudy night">
  <defs>
    <linearGradient id="moon" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="42" y2="34">
      <stop offset="0" stop-color="#FFF7DC"/>
      <stop offset="1" stop-color="#F0C24B"/>
    </linearGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="48">
      <stop offset="0" stop-color="#EDF2F7"/>
      <stop offset="1" stop-color="#A6B5C3"/>
    </linearGradient>
    <!-- Same crescent construction as night.svg, scaled to r=14. Sits left of
         centre so the lower horn falls behind the tallest part of the cloud. -->
    <mask id="bite">
      <circle cx="28" cy="20" r="14" fill="#fff"/>
      <circle cx="37.8" cy="20" r="14" fill="#000"/>
    </mask>
    <style>
      .moon  { animation: sway 6.5s ease-in-out infinite; transform-origin: 28px 20px; }
      .drift { animation: drift 7s ease-in-out infinite; }
      .star  { animation: twinkle 2.8s ease-in-out infinite; transform-origin: center; }
      .star2 { animation-delay: 1.1s; }
      @keyframes sway {
        0%, 100% { transform: rotate(-5deg); }
        50%      { transform: rotate(4deg); }
      }
      @keyframes drift {
        0%, 100% { transform: translateX(-2.5px); }
        50%      { transform: translateX(2.5px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: .2; transform: scale(.7); }
        50%      { opacity: 1;  transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .moon, .drift, .star { animation: none; }
      }
    </style>
  </defs>

  <g fill="#FFE9A8">
    <circle class="star"       cx="50" cy="13" r="1.8"/>
    <circle class="star star2" cx="57" cy="27" r="1.5"/>
  </g>

  <g transform="rotate(-20 28 20)">
    <g class="moon">
      <g mask="url(#bite)">
        <circle cx="28" cy="20" r="14" fill="url(#moon)"/>
        <circle cx="19.5" cy="16" r="2.1" fill="#DFAF41" opacity=".28"/>
        <circle cx="20.5" cy="26" r="1.5" fill="#DFAF41" opacity=".24"/>
      </g>
    </g>
  </g>

  <g class="drift" fill="url(#cloud)">
    <circle cx="21" cy="38" r="9"/>
    <circle cx="33" cy="34" r="11.5"/>
    <circle cx="44" cy="39.5" r="7.5"/>
    <rect x="12" y="40" width="32" height="7.5" rx="3.75"/>
  </g>
</svg>
