<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Partly cloudy">
  <defs>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="42" y1="11" x2="42" y2="31">
      <stop offset="0" stop-color="#FFDE72"/>
      <stop offset="1" stop-color="#FF9A16"/>
    </linearGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="48">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#B7C4D1"/>
    </linearGradient>
    <style>
      .rays  { animation: spin 22s linear infinite; transform-origin: 42px 21px; }
      .drift { animation: drift 7s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift {
        0%, 100% { transform: translateX(-2.5px); }
        50%      { transform: translateX(2.5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rays, .drift { animation: none; }
      }
    </style>
  </defs>

  <g class="rays" stroke="#FFB524" stroke-width="3" stroke-linecap="round">
    <line x1="42" y1="3"  x2="42" y2="8"/>
    <line x1="57" y1="21" x2="62" y2="21"/>
    <line x1="52.5" y1="10.5" x2="56" y2="7"/>
    <line x1="31.5" y1="10.5" x2="28" y2="7"/>
    <line x1="52.5" y1="31.5" x2="56" y2="35"/>
    <line x1="27"  y1="21" x2="22" y2="21"/>
  </g>
  <circle cx="42" cy="21" r="10" fill="url(#sun)"/>
  <circle cx="38.5" cy="17.5" r="3.2" fill="#FFF1C1" opacity=".45"/>

  <g class="drift" fill="url(#cloud)">
    <circle cx="21" cy="38" r="9"/>
    <circle cx="33" cy="34" r="11.5"/>
    <circle cx="44" cy="39.5" r="7.5"/>
    <rect x="12" y="40" width="32" height="7.5" rx="3.75"/>
  </g>
</svg>
